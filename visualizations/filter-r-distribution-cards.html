<div id="filter-r-distribution-cards" class="rd-root">
  <style>
    #filter-r-distribution-cards { color: var(--foreground); font: inherit; }
    #filter-r-distribution-cards .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    #filter-r-distribution-cards .card { border: 3px solid var(--primary); border-radius: 18px; padding: 18px 20px 20px; background: color-mix(in srgb, var(--card) 78%, transparent); }
    #filter-r-distribution-cards .top { display:flex; justify-content:space-between; gap: 12px; align-items:center; margin-bottom: 12px; }
    #filter-r-distribution-cards .name { font-weight: 500; font-size: calc(var(--font-size-base) * 1.22); }
    #filter-r-distribution-cards .badge { color: var(--primary-foreground); background: var(--primary); border-radius: 999px; padding: 7px 12px; font-weight: 500; white-space: nowrap; }
    #filter-r-distribution-cards .rules { display:grid; gap: 8px; margin-bottom: 14px; }
    #filter-r-distribution-cards .rule { display:grid; grid-template-columns: 58px 1fr; gap: 8px; align-items:start; }
    #filter-r-distribution-cards .tag { justify-self:start; color: var(--primary-foreground); background: var(--primary); border-radius: 6px; padding: 3px 8px; font-weight: 500; }
    #filter-r-distribution-cards .tag.stop, #filter-r-distribution-cards .tag.hold, #filter-r-distribution-cards .tag.expiry { background: color-mix(in srgb, var(--destructive) 72%, var(--primary) 28%); }
    #filter-r-distribution-cards .rule-text { color: color-mix(in srgb, var(--foreground) 72%, var(--muted-foreground)); }
    #filter-r-distribution-cards .rule-text strong { color: var(--foreground); font-weight: 500; }
    #filter-r-distribution-cards .stats { border-top: 1px solid var(--border); padding-top: 12px; display:flex; flex-wrap:wrap; gap: 14px; font-weight: 500; margin-bottom: 12px; }
    #filter-r-distribution-cards .stats span em { color: var(--muted-foreground); font-style: normal; }
    #filter-r-distribution-cards svg { width:100%; height:auto; display:block; overflow:visible; }
    #filter-r-distribution-cards text { fill: var(--foreground); font-weight: 500; }
    #filter-r-distribution-cards .pct { fill: var(--muted-foreground); font-weight: 400; }
    #filter-r-distribution-cards .zero { stroke: var(--border); stroke-width: 2; stroke-dasharray: 5 5; }
    #filter-r-distribution-cards .bar-neg { fill: color-mix(in srgb, var(--destructive) 55%, var(--card)); }
    #filter-r-distribution-cards .bar-big-loss { fill: var(--destructive); }
    #filter-r-distribution-cards .bar-pos { fill: color-mix(in srgb, var(--primary) 72%, var(--card)); }
    #filter-r-distribution-cards .bar-big-win { fill: var(--primary); }
    @media (min-width: 940px) { #filter-r-distribution-cards .grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 520px) { #filter-r-distribution-cards .card { padding: 14px; border-radius: 14px; } #filter-r-distribution-cards .rule { grid-template-columns: 48px 1fr; } #filter-r-distribution-cards .badge { padding: 5px 9px; } }
  </style>
  <div class="grid" aria-label="R distribution cards by filter"></div>
  <script>
    (() => {
      const root = document.getElementById('filter-r-distribution-cards');
      const grid = root.querySelector('.grid');
      const data = [{"title": "profit model", "badge": "기본 수익형", "entry": "B등급 이상 과열 종목이 다음 정규장에 셋업일 저가 - 0.02ATR 이하로 거래되면 숏 진입", "stop": "진입 후 셋업일 고가 + 0.10ATR 이상으로 올라가면 전량 커버", "hold": "가격이 +1R 하락하면 50% 커버하고 남은 수량은 진입가 본절 손절로 이동", "expiry": "부분익절·손절 조건이 없으면 진입 후 5거래일째 종가에 남은 포지션 청산", "trades": 179, "avg": 0.08, "median": 0.18, "winRate": 60, "bins": [{"label": "≤-1", "count": 0, "pct": 0}, {"label": "-1~-0.5", "count": 49, "pct": 27}, {"label": "-0.5~0", "count": 23, "pct": 13}, {"label": "0~0.5", "count": 50, "pct": 28}, {"label": "0.5~1", "count": 34, "pct": 19}, {"label": "1~1.5", "count": 20, "pct": 11}, {"label": "≥1.5", "count": 3, "pct": 2}]}, {"title": "A-grade subset", "badge": "고품질 우선", "entry": "A등급 과열 종목만 다음 정규장에 셋업일 저가 - 0.02ATR 이하로 거래되면 숏 진입", "stop": "진입 후 셋업일 고가 + 0.10ATR 이상으로 올라가면 전량 커버", "hold": "가격이 +1R 하락하면 50% 커버하고 남은 수량은 진입가 본절 손절로 이동", "expiry": "부분익절·손절 조건이 없으면 진입 후 5거래일째 종가에 남은 포지션 청산", "trades": 24, "avg": 0.13, "median": 0.23, "winRate": 62, "bins": [{"label": "≤-1", "count": 0, "pct": 0}, {"label": "-1~-0.5", "count": 5, "pct": 21}, {"label": "-0.5~0", "count": 4, "pct": 17}, {"label": "0~0.5", "count": 7, "pct": 29}, {"label": "0.5~1", "count": 5, "pct": 21}, {"label": "1~1.5", "count": 3, "pct": 12}, {"label": "≥1.5", "count": 0, "pct": 0}]}, {"title": "fade20", "badge": "실행 후보", "entry": "B등급 이상이고 셋업일 종가가 고점 대비 20% 이상 밀린 뒤 다음 정규장 저가 이탈 시 숏 진입", "stop": "진입 후 셋업일 고가 + 0.10ATR 이상으로 반등하면 전량 커버", "hold": "가격이 +0.5R 하락하면 50% 커버하고 남은 수량은 진입가 본절 손절로 이동", "expiry": "부분익절·손절 조건이 없으면 진입 후 3거래일째 종가에 남은 포지션 청산", "trades": 13, "avg": 0.46, "median": 0.4, "winRate": 85, "bins": [{"label": "≤-1", "count": 0, "pct": 0}, {"label": "-1~-0.5", "count": 0, "pct": 0}, {"label": "-0.5~0", "count": 2, "pct": 15}, {"label": "0~0.5", "count": 5, "pct": 38}, {"label": "0.5~1", "count": 5, "pct": 38}, {"label": "1~1.5", "count": 1, "pct": 8}, {"label": "≥1.5", "count": 0, "pct": 0}]}, {"title": "fade15", "badge": "감시 후보", "entry": "B등급 이상이고 셋업일 종가가 고점 대비 15% 이상 밀린 뒤 다음 정규장 저가 이탈 시 숏 진입", "stop": "진입 후 셋업일 고가 + 0.10ATR 이상으로 반등하면 전량 커버", "hold": "가격이 +0.5R 하락하면 50% 커버하고 남은 수량은 진입가 본절 손절로 이동", "expiry": "부분익절·손절 조건이 없으면 진입 후 3거래일째 종가에 남은 포지션 청산", "trades": 54, "avg": 0.21, "median": 0.27, "winRate": 67, "bins": [{"label": "≤-1", "count": 0, "pct": 0}, {"label": "-1~-0.5", "count": 8, "pct": 15}, {"label": "-0.5~0", "count": 10, "pct": 19}, {"label": "0~0.5", "count": 19, "pct": 35}, {"label": "0.5~1", "count": 11, "pct": 20}, {"label": "1~1.5", "count": 6, "pct": 11}, {"label": "≥1.5", "count": 0, "pct": 0}]}];
      const W = 760, H = 250;
      const m = {left: 26, right: 16, top: 30, bottom: 54};
      function svgEl(name, attrs={}, parent) { const node = document.createElementNS('http://www.w3.org/2000/svg', name); Object.entries(attrs).forEach(([k,v]) => node.setAttribute(k,v)); if (parent) parent.appendChild(node); return node; }
      function fmtR(x) { return `${x >= 0 ? '+' : ''}${Number(x).toFixed(2)}R`; }
      function ruleText(text) { return text.replace(/B등급 이상|A등급|20% 이상|15% 이상|저가 이탈|0.02ATR|0.10ATR|\+1R|\+0.5R|50%|본절|5거래일|3거래일|전량 커버|숏 진입/g, '<strong>$&</strong>'); }
      function draw(item) {
        const card = document.createElement('section');
        card.className = 'card';
        card.innerHTML = `<div class="top"><div class="name">${item.title}</div><div class="badge">${item.badge}</div></div><div class="rules"><div class="rule"><span class="tag">진입</span><span class="rule-text">${ruleText(item.entry)}</span></div><div class="rule"><span class="tag stop">손절</span><span class="rule-text">${ruleText(item.stop)}</span></div><div class="rule"><span class="tag hold">보유</span><span class="rule-text">${ruleText(item.hold)}</span></div><div class="rule"><span class="tag expiry">만기</span><span class="rule-text">${ruleText(item.expiry)}</span></div></div><div class="stats"><span>진입 <em>${item.trades}건</em></span><span>평균 <em>${fmtR(item.avg)}</em></span><span>중앙 <em>${fmtR(item.median)}</em></span><span>승률 <em>${item.winRate}%</em></span></div>`;
        const svg = svgEl('svg', {viewBox:`0 0 ${W} ${H}`, role:'img', 'aria-label':`${item.title} R distribution histogram`});
        card.appendChild(svg); grid.appendChild(card);
        const innerW = W - m.left - m.right, innerH = H - m.top - m.bottom;
        const maxCount = Math.max(1, ...item.bins.map(d=>d.count));
        const bw = innerW / item.bins.length;
        const zeroX = m.left + bw * 3;
        svgEl('line', {x1:zeroX, x2:zeroX, y1:m.top, y2:m.top+innerH, class:'zero'}, svg);
        item.bins.forEach((d,i) => {
          const h = d.count / maxCount * (innerH - 18);
          const x = m.left + i*bw + bw*.08;
          const y = m.top + innerH - h;
          const cls = i === 0 ? 'bar-big-loss' : i < 3 ? 'bar-neg' : i === item.bins.length-1 ? 'bar-big-win' : 'bar-pos';
          const rect = svgEl('rect', {x:x, y:y, width:bw*.84, height:Math.max(2,h), rx:5, class:cls}, svg);
          svgEl('title', {}, rect).textContent = `${d.label}: ${d.count}건 (${d.pct}%)`;
          const count = svgEl('text', {x:x+bw*.42, y:y-8, 'text-anchor':'middle'}, svg); count.textContent = d.count;
          const label = svgEl('text', {x:x+bw*.42, y:H-31, 'text-anchor':'middle', class:'pct'}, svg); label.textContent = d.label;
          const pct = svgEl('text', {x:x+bw*.42, y:H-10, 'text-anchor':'middle', class:'pct'}, svg); pct.textContent = `${d.pct}%`;
        });
      }
      data.forEach(draw);
    })();
  </script>
</div>
